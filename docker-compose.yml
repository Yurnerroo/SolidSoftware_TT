services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5433:5432"
    volumes:
      - ./db/migrations/001_base_schema.sql:/docker-entrypoint-initdb.d/001_base_schema.sql:ro
      - ./db/migrations/002_payments.sql:/docker-entrypoint-initdb.d/002_payments.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/zz_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 2s
      timeout: 3s
      retries: 20
